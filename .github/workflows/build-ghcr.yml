name: "Build and publish to GHCR"

# Publishes ghcr.io/<owner>/solidtime for this fork.
#
# Modelled on build-onpremise.yml, with three differences: it targets GHCR and authenticates
# with the automatic GITHUB_TOKEN rather than a registry secret, it drops the Invoicing
# extension steps (that repository is private and absent from this fork), and it runs on every
# push to main rather than only on tags.
#
# The asset build stage in docker/prod/Dockerfile is commented out, so vendor/ and public/build
# are produced here on the runner and copied into the image. Skipping these steps would produce
# an image that boots and then 500s on the first Inertia page.

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

concurrency:
    group: "ghcr-${{ github.ref }}"
    cancel-in-progress: true

env:
    DOCKER_REPO: "ghcr.io/${{ github.repository_owner }}/solidtime"

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Native runners rather than QEMU. Emulated arm64 builds of a PHP image take
                    # the best part of an hour; both of these are free for public repositories.
                    - runs-on: "ubuntu-24.04"
                      platform: "linux/amd64"
                    - runs-on: "ubuntu-24.04-arm"
                      platform: "linux/arm64"
        runs-on: ${{ matrix.runs-on }}
        permissions:
            contents: read
            packages: write
        steps:
            - name: "Check out code"
              uses: actions/checkout@v7
              with:
                  # Needed for git describe to see tags when working out the version
                  fetch-depth: 0

            - name: "Get build"
              id: release-build
              run: echo "build=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

            - name: "Get version"
              id: release-version
              run: |
                  # A tag build is that version. A push to main is the last tag with a -dev
                  # suffix, so APP_VERSION is always meaningful. A repository with no tags yet
                  # falls back to 0.0.0 rather than failing the build, which is what upstream
                  # does - it has tags, this fork may not yet.
                  if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                      version="${GITHUB_REF#refs/tags/v}"
                  else
                      previous=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
                      if [[ -n "${previous}" ]]; then
                          version="${previous#v}-dev.${{ steps.release-build.outputs.build }}"
                      else
                          version="0.0.0-dev.${{ steps.release-build.outputs.build }}"
                      fi
                  fi
                  echo "app_version=${version}" >> "$GITHUB_OUTPUT"
                  echo "Building version ${version}"

            - name: "Copy .env template for production"
              run: |
                  cp .env.production .env
                  rm .env.production .env.ci .env.example

            - name: "Add version and build to .env"
              run: |
                  sed -i 's/APP_VERSION=0.0.0/APP_VERSION=${{ steps.release-version.outputs.app_version }}/g' .env
                  sed -i 's/APP_BUILD=0/APP_BUILD=${{ steps.release-build.outputs.build }}/g' .env

            - name: "Setup PHP"
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: pdo_pgsql, zip, gd, intl, bcmath, pcntl
                  coverage: none

            - name: "Install composer dependencies"
              run: composer install --no-dev --no-ansi --no-interaction --prefer-dist --classmap-authoritative

            - name: "Use Node.js"
              uses: actions/setup-node@v7
              with:
                  # Vite 7 refuses anything older
                  node-version: "22"

            - name: "Install npm dependencies"
              run: npm ci

            - name: "Build assets"
              # Reads VITE_APP_NAME from the .env written above, so the tab title is baked here
              run: npm run build

            - name: "Prepare platform pair"
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

            - name: "Docker meta"
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.DOCKER_REPO }}

            - name: "Log in to GHCR"
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  # Provided automatically, no PAT to create or rotate
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: "Set up Docker Buildx"
              uses: docker/setup-buildx-action@v4

            - name: "Build and push by digest"
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/prod/Dockerfile
                  build-args: |
                      DOCKER_FILES_BASE_PATH=docker/prod/
                  platforms: ${{ matrix.platform }}
                  labels: ${{ steps.meta.outputs.labels }}
                  outputs: type=image,"name=${{ env.DOCKER_REPO }}",push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
                  cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

            - name: "Export digest"
              run: |
                  mkdir -p /tmp/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: "Upload digest"
              uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        # The two platform builds pushed anonymous digests. This joins them into one multi-arch
        # tag, so `docker pull` picks the right architecture by itself.
        runs-on: ubuntu-latest
        needs: [build]
        permissions:
            contents: read
            packages: write
        steps:
            - name: "Check out code"
              uses: actions/checkout@v7

            - name: "Download digests"
              uses: actions/download-artifact@v8
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: "Docker meta"
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.DOCKER_REPO }}
                  tags: |
                      # Semantic versioning from a v* tag: 1.2.3, 1.2 and 1
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      # Every push to main is addressable by its commit
                      type=sha,prefix=sha-,format=short
                      # "latest" tracks main. Point production at a version tag instead.
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: "Log in to GHCR"
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: "Set up Docker Buildx"
              uses: docker/setup-buildx-action@v4

            - name: "Create manifest list and push"
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                      $(printf '${{ env.DOCKER_REPO }}@sha256:%s ' *)

            - name: "Inspect image"
              run: docker buildx imagetools inspect ${{ env.DOCKER_REPO }}:${{ steps.meta.outputs.version }}
